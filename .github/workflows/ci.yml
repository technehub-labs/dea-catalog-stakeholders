name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-stakeholder-entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      # Phase 2 deferred-population scaffold: skip validation when the
      # entities/ tree is empty. See dea-catalog-processes fix PR for
      # the full rationale and the early-exit pattern.
      - name: Check for catalog entries
        id: check
        run: |
          shopt -s nullglob globstar
          count=0
          for f in entities/**/*.yaml entities/**/*.json; do
            [ -f "$f" ] && count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No catalog entries to validate (Phase 2 not started). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # CR-CATALOG-STRUCT-12: the dsanders11 action step is replaced by the
      # house record gate (scripts/check_schema.py) — schema-faithfulness
      # projection check + fixture behavior + per-record validation, the
      # dea-catalog-information-models gate pattern. Unlike the action, it
      # parses YAML records and asserts the projection constants.
      - name: Validate catalog entries against Stakeholder schema
        if: steps.check.outputs.skip != 'true'
        run: python scripts/check_schema.py
