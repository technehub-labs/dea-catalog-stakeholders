name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-stakeholder-entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Phase 2 deferred-population scaffold: skip validation when the
      # entities/ tree is empty. See dea-catalog-processes fix PR for
      # the full rationale and the early-exit pattern.
      - name: Check for catalog entries
        id: check
        run: |
          shopt -s nullglob globstar
          count=0
          for f in entities/**/*.yaml entities/**/*.json; do
            [ -f "$f" ] && count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No catalog entries to validate (Phase 2 not started). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate catalog entries against Stakeholder schema
        if: steps.check.outputs.skip != 'true'
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json
