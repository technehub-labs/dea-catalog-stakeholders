id: stakeholders:stakeholder-trade-secret-enforcement-authority-2374nw
type: Stakeholder
name: Trade-secret enforcement authority
description: 'The authority or court enforcing trade-secret protection statutes in
  national and supranational regimes (the Defend Trade Secrets Act in the US,
  Directive (EU) 2016/943 in member states, the Unfair Competition Prevention
  Act in Japan). Role record: the trade-secret enforcement capacity is common
  across governed territories; the named authorities and courts are instance
  evidence. Role-class record (CR-CATALOG-STRUCT-16): the named parties that
  hold this capacity are instance evidence, never the record identity; for
  this enterprise the engaged instance is the EU member-state competent
  authorities and courts.'
