id: stakeholders:stakeholder-data-protection-coordination-authority-rj5pwj
type: Stakeholder
name: Data-protection coordination authority
description: 'The body coordinating or supervising data-protection enforcement above the
  single-jurisdiction level (a coordination board of national authorities, an
  institutional supervisor, or the global assembly of privacy regulators),
  engaging the enterprise through consistent-application decisions and
  cross-border enforcement coordination. Role record, typified by >=3 logged
  URL evidence instances; each named body is instance evidence. Role-class
  record (CR-CATALOG-STRUCT-16): the named parties that hold this capacity
  are instance evidence, never the record identity; for this enterprise the
  engaged instance is the European Data Protection Board with the national
  supervisory authorities it coordinates.'
