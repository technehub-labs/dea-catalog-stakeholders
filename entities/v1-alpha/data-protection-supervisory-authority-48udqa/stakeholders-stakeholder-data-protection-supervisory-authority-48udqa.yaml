name: Data-protection supervisory authority
description: 'The supervisory authority enforcing a national data-protection regime (UK
  GDPR, FADP, PIPEDA, Privacy Act 1988, LGPD, PDPO, APPI, PDPA, NZ Privacy
  Act 2020, PIPL, PIPA and equivalents) with enforcement powers over the
  enterprise''s jurisdiction-facing processing. Role record: the capacity is
  common across governed territories; each named authority is instance
  evidence. Role-class record (CR-CATALOG-STRUCT-16): the named parties that
  hold this capacity are instance evidence, never the record identity; for
  this enterprise the engaged instance is the UK Information Commissioner''s
  Office (ICO).'
