id: stakeholders:stakeholder-state-consumer-privacy-regulator-r9h6sp
type: Stakeholder
name: State consumer-privacy regulator
description: 'The state or provincial authority holding rulemaking and enforcement powers
  under a subnational consumer-privacy statute (e.g. the CCPA as amended by
  the CPRA, the Colorado Privacy Act, the TDPSA, the VCDPA), over the
  enterprise''s jurisdiction-facing processing. Role record: the capacity is
  common across governed subnational territories; the state agencies and
  attorneys general are instance evidence. Role-class record
  (CR-CATALOG-STRUCT-16): the named parties that hold this capacity are
  instance evidence, never the record identity; for this enterprise the
  engaged instance is the California Privacy Protection Agency and the
  California Attorney General.'
