id: stakeholders:stakeholder-gdpr-supervisory-authority-qryy8j
type: Stakeholder
name: GDPR supervisory authority
description: 'The supervisory authority competent for the GDPR within its jurisdiction,
  holding investigation, corrective and enforcement powers over the
  enterprise''s jurisdiction-facing processing. Role record: the GDPR
  supervisory capacity is common across every GDPR-governed territory; the
  competent authority of each is carried as instance evidence, never as the
  record identity. Role-class record (CR-CATALOG-STRUCT-16): the named
  parties that hold this capacity are instance evidence, never the record
  identity; for this enterprise the engaged instance is the EDPB-coordinated
  collective of national supervisory authorities.'
