# Metamodel Pointer — Stakeholders
#
# Two consumers, two blocks (CR-CATALOG-STRUCT-12, per the
# dea-catalog-information-models pointer form):
#   - the top-level identity keys are consumed by the vendored
#     regenerate_catalog.py to build CATALOG.yaml's catalog block;
#   - the `metamodel:` allocation block is validated by
#     dea-architecture-framework validate-against-model.yml
#     against the pinned root-model ref (v0.9.0), and asserted
#     locally by scripts/check_pointer.py.
#
# Allocation changes go through the root model, not this file.
id: dea:catalog-stakeholders
name: Stakeholders
abbreviation: SH
version: 0.1.0
status: active
metamodel_version: 1.0.0
owner: TechNeHub Labs
description: |
  External or affected parties whose relationship with the enterprise
  is engaged in or affected by enterprise processes. Stakeholders are
  NOT internal performers — internal performers (employees, teams,
  systems, AI agents) are Actors, not Stakeholders.
metamodel:
  building_block: L1-external-parties
  class_alias: SH
  entity_id: dea:entity-stakeholder
  layer: L1
  version: v0.9.0
  viewer_url: https://technehub-labs.github.io/metamodel/?entity=SH
links:
  metamodel_repo: https://github.com/technehub-labs/dea-metamodel
  root_model: https://github.com/technehub-labs/dea-architecture-framework
  viewer: https://technehub-labs.github.io/metamodel/?entity=SH
  github: https://github.com/technehub-labs/dea-catalog-stakeholders
